<h1>Welcome to the Movie Reviews Home Page, {{ name }}</h1>
<h2>This is the full home page content.</h2>

<div class="container">
    <form action="">
        <div class="mb-3">
            <label for="searchMovie" class="form-label">
                Search Movie
            </label>
            <input type="text" class="form-control" name="searchMovie"/>
        </div>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>
    <p>Searching for {{ searchterm }}</p>
        {% for movie in movies %}
            <h2>{{ movie.title }}</h2>
            <h3>{{ movie.description }}</h3>
            <img src="{{ movie.image.url }}">
            {% if movie.url %}
                <a href="{{ movie.url }}">Movie Link</a>
            {% endif %}
        {% endfor %}
    <br/>
</div>
